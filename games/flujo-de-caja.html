<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flujo de Caja — MonkeyMoney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --surface:#14141c;
    --surface2:#1b1b26;
    --surface3:#22222f;
    --green:#3dffa0;
    --green-dim:#1e5c46;
    --magenta:#ff2fb0;
    --magenta-dim:#5c1e46;
    --gold:#e8c15a;
    --danger:#ff5566;
    --text:#f2f2f7;
    --muted:#8f8fa8;
    --line:#2a2a38;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:18px;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:0.35;z-index:0;pointer-events:none;}
  .blob-a{width:420px;height:420px;background:var(--green);top:-140px;left:-140px;}
  .blob-b{width:460px;height:460px;background:var(--magenta);bottom:-160px;right:-140px;}

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    background:var(--surface);
    border-radius:26px;
    border:1px solid var(--line);
    box-shadow:10px 10px 0 rgba(0,0,0,0.45);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:720px;
  }
  .stage.shake{ animation: shakeX 0.4s ease; }
  @keyframes shakeX{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-10px) rotate(-0.5deg);}
    30%{transform:translateX(9px) rotate(0.5deg);}
    45%{transform:translateX(-7px);}
    60%{transform:translateX(6px);}
    75%{transform:translateX(-4px);}
    90%{transform:translateX(2px);}
  }
  .flash-red{ animation: flashRed 0.5s ease; }
  @keyframes flashRed{ 0%{background:rgba(255,60,80,0.25);} 100%{background:transparent;} }
  .flash-green{ animation: flashGreen 0.5s ease; }
  @keyframes flashGreen{ 0%{background:rgba(61,255,160,0.18);} 100%{background:transparent;} }
  .flash-overlay{position:absolute; inset:0; pointer-events:none; z-index:20; border-radius:26px;}

  /* HEADER */
  .topbar{
    padding:16px 18px 12px 18px;
    border-bottom:1px solid var(--line);
    background:var(--surface2);
  }
  .topbar-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .brand{
    font-family:'Unbounded',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:0.5px; color:var(--text); display:flex; align-items:center; gap:8px;
  }
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green); box-shadow:0 0 8px var(--green); animation:pulseDot 1.6s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:0.4;}}
  .month-label{font-family:'Space Mono',monospace; font-size:11px; color:var(--muted);}
  .dots{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px;}
  .dot-pip{width:100%; max-width:20px; flex:1; height:6px; border-radius:3px; background:var(--surface3); transition:background 0.3s, transform 0.3s;}
  .dot-pip.done{background:var(--green);}
  .dot-pip.current{background:var(--magenta); animation:popIn 0.4s ease;}
  @keyframes popIn{0%{transform:scaleY(1);} 40%{transform:scaleY(2.2);} 100%{transform:scaleY(1);}}

  .stats-row{display:flex; gap:8px;}
  .stat{
    flex:1; background:var(--surface3); border-radius:12px; padding:8px 10px;
    border:1px solid var(--line); position:relative; overflow:visible;
  }
  .stat .k{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:3px;}
  .stat .v{font-family:'Space Mono',monospace; font-weight:700; font-size:16px; transition:transform 0.15s;}
  .v.cash{color:var(--green);}
  .v.inv{color:#8fc8ff;}
  .v.debt{color:var(--danger);}
  .stat.bump .v{transform:scale(1.18);}

  .particle-layer{position:absolute; inset:0; pointer-events:none; z-index:30; overflow:visible;}
  .coin-particle{
    position:absolute; font-size:14px; opacity:1; will-change:transform,opacity;
    animation: coinFly 0.9s ease-out forwards;
  }
  @keyframes coinFly{
    0%{transform:translate(0,0) scale(0.6) rotate(0deg); opacity:1;}
    70%{opacity:1;}
    100%{transform:translate(var(--dx), -70px) scale(1.1) rotate(var(--rot)); opacity:0;}
  }
  .confetti-piece{
    position:absolute; top:-20px; width:8px; height:14px; opacity:0.95;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(720px) rotate(720deg); opacity:0;}
  }

  /* SCENE */
  .scene{
    flex:1; padding:18px 18px 16px 18px; display:flex; flex-direction:column; gap:12px;
    position:relative; overflow-y:auto;
  }
  .month-title{
    font-family:'Unbounded',sans-serif; font-weight:700; font-size:21px; line-height:1.15;
  }
  .month-theme{color:var(--gold); font-size:12px; font-weight:600; margin-top:2px;}

  .mono-wrap{display:flex; justify-content:center; margin:2px 0 0 0; position:relative; height:96px;}
  .face-badge{
    width:96px; height:96px; border-radius:50%; position:relative;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #232323, #0f0f0f);
    border:2px solid var(--surface3);
    animation: idleBob 2.6s ease-in-out infinite;
    transition: filter 0.35s, transform 0.35s;
  }
  .face-badge img{ width:88%; height:88%; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
  @keyframes idleBob{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-4px) rotate(-1.5deg);} }

  .face-badge.state-worried{ filter:saturate(0.65) brightness(0.92); animation: worryShake 0.6s ease-in-out infinite; }
  @keyframes worryShake{ 0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);} }
  .face-badge.state-crisis{ filter:saturate(0.5) brightness(0.8); animation: crisisShake 0.35s ease-in-out infinite; box-shadow:0 0 24px rgba(255,60,80,0.55); }
  @keyframes crisisShake{ 0%,100%{transform:rotate(-4deg) translateX(-2px);} 50%{transform:rotate(4deg) translateX(2px);} }
  .face-badge.state-win{ animation: winBounce 0.7s ease-in-out infinite; box-shadow:0 0 30px rgba(232,193,90,0.7); }
  @keyframes winBounce{ 0%,100%{transform:scale(1) translateY(0);} 50%{transform:scale(1.08) translateY(-6px);} }
  .face-badge.state-cool{ box-shadow:0 0 20px rgba(61,255,160,0.5); }

  .sweat{position:absolute; font-size:16px; animation: sweatDrop 1.1s ease-in infinite; pointer-events:none;}
  @keyframes sweatDrop{ 0%{transform:translateY(0) scale(0.6); opacity:0;} 30%{opacity:1;} 100%{transform:translateY(22px) scale(1); opacity:0;} }
  .orbit-dollar{position:absolute; font-size:15px; animation: orbitFloat 1.8s ease-in-out infinite; pointer-events:none;}
  @keyframes orbitFloat{ 0%,100%{transform:translate(0,0) rotate(0deg);} 50%{transform:translate(0,-10px) rotate(8deg);} }

  .narrative{
    font-size:13.5px; line-height:1.5; color:#d8d8e2; background:var(--surface2);
    padding:11px 13px; border-radius:14px; border:1px solid var(--line);
  }

  .breakdown{
    background:var(--surface2); border-radius:14px; border:1px solid var(--line);
    padding:12px 14px; font-family:'Space Mono',monospace; font-size:12.5px;
  }
  .breakdown-row{display:flex; justify-content:space-between; padding:4px 0; color:#c8c8d6; opacity:0; animation: rowIn 0.4s ease forwards;}
  .breakdown-row.total{border-top:1px dashed var(--line); margin-top:6px; padding-top:8px; font-weight:700; color:var(--text);}
  @keyframes rowIn{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);} }
  .pos{color:var(--green);}
  .neg{color:var(--danger);}

  /* SWIPE CARD */
  .card-zone{ position:relative; min-height:230px; touch-action:none; }
  .event-card{
    position:absolute; inset:0; background:linear-gradient(160deg, var(--surface2), var(--surface3));
    border:1.5px solid var(--line); border-radius:18px; padding:16px;
    display:flex; flex-direction:column; cursor:grab;
    box-shadow:5px 5px 0 rgba(0,0,0,0.35);
    will-change:transform;
    user-select:none;
  }
  .event-card:active{ cursor:grabbing; }
  .event-label{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--magenta); margin-bottom:8px; font-weight:700;}
  .event-prompt{font-size:13.5px; line-height:1.5; margin-bottom:10px; color:var(--text); flex:1;}
  .swipe-hint{font-size:10.5px; color:var(--muted); text-align:center; font-family:'Space Mono',monospace; letter-spacing:0.5px;}

  .stamp{
    position:absolute; top:14px; font-family:'Unbounded',sans-serif; font-weight:800; font-size:16px;
    padding:6px 12px; border-radius:8px; border:3px solid; opacity:0; pointer-events:none;
    text-transform:uppercase; letter-spacing:1px;
  }
  .stamp.left{ left:14px; color:var(--green); border-color:var(--green); transform:rotate(-12deg); }
  .stamp.right{ right:14px; color:var(--magenta); border-color:var(--magenta); transform:rotate(12deg); }

  .choices{display:flex; gap:8px; margin-top:10px;}
  .choice-btn{
    flex:1; text-align:center; border:1.5px solid var(--line); background:var(--surface);
    border-radius:12px; padding:10px 8px; color:var(--text); font-family:'Plus Jakarta Sans';
    font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s ease;
    box-shadow:3px 3px 0 rgba(0,0,0,0.3);
  }
  .choice-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.3);}
  .choice-btn .tag{display:block; font-size:9px; letter-spacing:1px; color:var(--muted); margin-bottom:3px; text-transform:uppercase; font-family:'Space Mono',monospace;}
  .choice-btn.left .tag{color:var(--green);}
  .choice-btn.right .tag{color:var(--magenta);}

  /* SLIDER */
  .slider-box{background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .slider-title{font-size:13px; margin-bottom:4px; font-weight:700;}
  .slider-sub{font-size:11.5px; color:var(--muted); margin-bottom:14px;}
  .split-readout{display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:12px; margin-bottom:8px;}
  .split-readout .save{color:var(--green);}
  .split-readout .reinvest{color:#8fc8ff;}
  .slider-track{
    position:relative; height:44px; background:var(--surface3); border-radius:22px;
    border:1px solid var(--line); overflow:hidden; touch-action:none; cursor:pointer;
  }
  .slider-fill{position:absolute; top:0; left:0; height:100%; background:linear-gradient(90deg, var(--green), #1e5c46); border-radius:22px; pointer-events:none;}
  .slider-handle{
    position:absolute; top:3px; width:38px; height:38px; border-radius:50%;
    background:var(--text); box-shadow:0 2px 6px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center; font-size:14px; pointer-events:none;
  }

  /* BUTTONS */
  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:14px; background:var(--green);
    color:#052015; font-family:'Unbounded',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; box-shadow:4px 4px 0 rgba(0,0,0,0.4); transition:transform 0.12s;
  }
  .btn-primary:active{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.4);}

  .toast{
    background:var(--surface3); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font-size:12.5px; box-shadow:4px 4px 0 rgba(0,0,0,0.4);
    animation:slideDown 0.3s ease;
  }
  @keyframes slideDown{from{transform:translateY(-16px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .toast.bad{border-color:var(--danger);}
  .toast.good{border-color:var(--green);}

  /* END SCREEN */
  .end-screen{padding:26px 22px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; flex:1; justify-content:center; position:relative;}
  .hex-badge{
    width:120px; height:132px; position:relative; display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5)); animation: badgeIn 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes badgeIn{ 0%{transform:scale(0) rotate(-30deg); opacity:0;} 100%{transform:scale(1) rotate(0deg); opacity:1;} }
  .hex-badge svg{width:100%; height:100%;}
  .hex-badge .label{position:absolute; font-family:'Unbounded',sans-serif; font-weight:800; font-size:15px;}
  .end-title{font-family:'Unbounded',sans-serif; font-weight:800; font-size:20px; margin-top:4px;}
  .end-sub{color:var(--muted); font-size:13px; max-width:300px; line-height:1.5;}
  .end-score{font-family:'Space Mono',monospace; font-size:32px; font-weight:700; color:var(--green);}
  .end-recap{
    width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; text-align:left; font-family:'Space Mono',monospace; font-size:11.5px;
  }

  .intro{padding:26px 24px; display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center; text-align:center;}
  .intro h1{font-family:'Unbounded',sans-serif; font-size:26px; font-weight:800; margin:0; line-height:1.2;}
  .intro .tagline{color:var(--gold); font-size:13px; font-weight:600;}
  .intro p{color:#c8c8d6; font-size:13.5px; line-height:1.6; margin:0;}
  .intro-face{width:100px; height:100px; margin:0 auto 4px auto; animation: idleBob 2.6s ease-in-out infinite;}
  .intro-face img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5));}
  .rules-list{text-align:left; font-size:12.5px; color:#c8c8d6; background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; line-height:1.7;}
  .rules-list b{color:var(--text);}

  ::-webkit-scrollbar{width:0px;}

  .lang-toggle{ display:flex; gap:4px; }
  .lang-btn{
    font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.5px;
    padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--surface3);
    color:var(--muted); cursor:pointer; transition:all 0.15s;
  }
  .lang-btn.active{ background:var(--green); color:#052015; border-color:var(--green); }
  .intro .lang-toggle{ position:absolute; top:14px; right:14px; }
  .end-screen .lang-toggle{ position:absolute; top:14px; right:14px; z-index:6; }
  .intro{ position:relative; }

  .biz-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:6px;
  }
  .biz-card{
    background:var(--surface2); border:1.5px solid var(--line); border-radius:16px;
    padding:16px 8px; display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,0.3); transition:all 0.15s ease;
  }
  .biz-card:hover{ border-color:var(--green); transform:translateY(-2px); }
  .biz-card:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.3); }
  .biz-emoji{ font-size:34px; }
  .biz-name{ font-family:'Plus Jakarta Sans'; font-weight:700; font-size:12px; color:var(--text); }


</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<div class="stage" id="stage">
  <div class="flash-overlay" id="flashOverlay"></div>
  <div class="particle-layer" id="particleLayer"></div>
</div>

/* ============ LANG DETECTION ============ */
function detectLang(){
  try{
    const keys = ['mm_lang','language','siteLanguage','lang','site_lang'];
    for(const k of keys){
      const v = localStorage.getItem(k);
      if(v && (v.toLowerCase().startsWith('en') || v.toLowerCase().startsWith('es'))){
        return v.toLowerCase().startsWith('en') ? 'en' : 'es';
      }
    }
  }catch(e){}
  const nav = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
  return nav.startsWith('en') ? 'en' : 'es';
}

}

/* ============ SOUND (WebAudio synth, no files needed) ============ */
let actx;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type='sine', vol=0.18, delay=0){
  ensureAudio(); if(!actx) return;
  const t0 = actx.currentTime + delay;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxCoin(){ beep(880,0.08,'square',0.14); beep(1320,0.1,'square',0.12,0.06); }
function sfxBad(){ beep(180,0.25,'sawtooth',0.16); beep(120,0.3,'sawtooth',0.14,0.08); }
function sfxClick(){ beep(600,0.05,'sine',0.1); }
function sfxWin(){ [660,880,1100,1320].forEach((f,i)=>beep(f,0.15,'triangle',0.15,i*0.09)); }
function sfxSwipe(){ beep(400,0.1,'sine',0.08); beep(700,0.08,'sine',0.06,0.04); }
function sfxSnap(){ beep(300,0.06,'sine',0.08); }

/* ============ HELPERS ============ */
function fmt(n){
  const localeStr = currentLang==='en' ? 'en-US' : 'es-MX';
  return (n<0?"-$":"$") + Math.abs(Math.round(n)).toLocaleString(localeStr);
}
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
const stageEl = document.getElementById('stage');

function animateNumber(el, from, to, duration=650){
  const start = performance.now();
  function tick(now){
    const p = clamp((now-start)/duration, 0, 1);
    const eased = 1 - Math.pow(1-p, 3);
    const val = Math.round(from + (to-from)*eased);
    el.textContent = fmt(val);
    if(p<1) requestAnimationFrame(tick);
    else el.textContent = fmt(to);
  }
  requestAnimationFrame(tick);
}

function setupSwipeCard(){
  const card = document.getElementById('eventCard');
  const stampL = document.getElementById('stampLeft');
  const stampR = document.getElementById('stampRight');
  if(!card) return;
  let startX=0, dx=0, dragging=false, decided=false;
  const threshold = 90;

  function onDown(e){
    if(decided) return;
    dragging = true;
    startX = (e.touches? e.touches[0].clientX : e.clientX);
    card.style.transition = 'none';
  }
  function onMove(e){
    if(!dragging || decided) return;
    const x = (e.touches? e.touches[0].clientX : e.clientX);
    dx = x - startX;
    const rot = clamp(dx/12, -18, 18);
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const tt = clamp(Math.abs(dx)/threshold, 0, 1);
    if(dx < 0){ stampL.style.opacity = tt; stampR.style.opacity = 0; }
    else { stampR.style.opacity = tt; stampL.style.opacity = 0; }
  }
  function onUp(){
    if(!dragging || decided) return;
    dragging = false;
    if(Math.abs(dx) > threshold){
      decided = true;
      sfxSwipe();
      const finalDx = dx;
      const flyX = finalDx > 0 ? 500 : -500;
      card.style.transition = 'transform 0.35s ease';
      card.style.transform = `translateX(${flyX}px) rotate(${finalDx>0?30:-30}deg)`;
      cleanup();
      setTimeout(()=> pickOption(finalDx>0 ? 'B' : 'A'), 260);
    } else {
      sfxSnap();
      card.style.transition = 'transform 0.3s cubic-bezier(.34,1.56,.64,1)';
      card.style.transform = 'translateX(0) rotate(0deg)';
      stampL.style.opacity = 0; stampR.style.opacity = 0;
    }
    dx = 0;
  }
  function cleanup(){
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  }

  card.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  card.addEventListener('touchstart', onDown, {passive:true});
  card.addEventListener('touchmove', onMove, {passive:true});
  card.addEventListener('touchend', onUp);
}

let monthAccum = {};

function pickOption(letter){
  if(letter !== 'A' && letter !== 'B') return;
  sfxClick();
  const mo = currentMonth();
  const opt = mo[letter];
  monthAccum = { salesBonus: opt.salesBonus||0, toastMsgs: [] };

  if(opt.cashDelta) state.cash += opt.cashDelta;
  if(opt.inventoryDelta) state.inventory = clamp(state.inventory + opt.inventoryDelta, 0, 150);
  if(opt.receivable){
    state.receivables.push({ amount:opt.receivable.amount, dueMonth: state.monthIndex + opt.receivable.months });
  }
  if(opt.nextMonthBonus){
    if(state.monthIndex+1 < MONTH_SLOTS().length) monthAccum.carryBonus = opt.nextMonthBonus;
  }
  if(opt.riskChance && Math.random() < opt.riskChance){
    const rfx = opt.riskEffect;
    if(rfx.cashDelta) state.cash += rfx.cashDelta;
    if(rfx.salesBonus) monthAccum.salesBonus += rfx.salesBonus;
    monthAccum.toastMsgs.push({text: rfx.message, bad:true});
  } else if(opt.resultGood){
    monthAccum.toastMsgs.push({text: opt.resultGood, bad:false});
  }

  resolveMonthFinance();
}

function resolveMonthFinance(){
  const mo = currentMonth();
  const invMult = 0.5 + state.inventory/100;
  const randFactor = 0.9 + Math.random()*0.2;
  const sales = Math.max(0, Math.round((mo.base + (monthAccum.salesBonus||0)) * invMult * randFactor));
  state.inventory = clamp(state.inventory - Math.round(sales/6), 0, 150);
  state.cash += sales;

  let collected = 0;
  state.receivables = state.receivables.filter(r=>{
    if(r.dueMonth <= state.monthIndex){ collected += r.amount; return false; }
    return true;
  });
  state.cash += collected;

  let interest = 0;
  if(state.debt > 0){ interest = Math.round(state.debt*0.12); state.cash -= interest; }

  state.cash -= mo.fixed;

  let crisisLoan = 0;
  if(state.cash < 0){
    crisisLoan = Math.round(Math.abs(state.cash) * 1.3);
    state.debt += crisisLoan;
    state.cash = 0;
    state.crisisCount += 1;
  }

  if(monthAccum.carryBonus){
    if(!state.nextBonusQueue) state.nextBonusQueue = 0;
    state.nextBonusQueue += monthAccum.carryBonus;
  }

  state.log.push({ name:mo.name, sales, fixed:mo.fixed, collected, interest, crisisLoan });

  renderBreakdown({sales, fixed:mo.fixed, collected, interest, crisisLoan}, mo.base + (monthAccum.salesBonus||0));
}

let prevCashDisplay = null;

function renderBreakdown(b, cashBeforeMonth){
  currentView = { name:'breakdown', b, cashBeforeMonth };
  const mo = currentMonth();
  const toasts = (monthAccum.toastMsgs||[]).map(tm=>`<div class="toast ${tm.bad?'bad':'good'}">${tm.bad?'⚠️ ':'✅ '}${tm.text}</div>`).join('');
  const cashStart = prevCashDisplay !== null ? prevCashDisplay : state.cash;

  const fState = b.crisisLoan>0 ? 'crisis' : 'cool';

  let rows = [
    {label:t('ventasDelMes'), val:b.sales, cls:'pos', prefix:'+'},
  ];
  rows.push({label:t('costosFijos'), val:-b.fixed, cls:'neg', prefix:'-'});
  if(b.collected>0) rows.push({label:t('cobranzaRecibida'), val:b.collected, cls:'pos', prefix:'+'});
  if(b.interest>0) rows.push({label:t('interesDeuda'), val:-b.interest, cls:'neg', prefix:'-'});

  let rowsHTML = rows.map((r,i)=>`<div class="breakdown-row" style="animation-delay:${i*0.12}s;"><span>${r.label}</span><span class="${r.cls}">${r.prefix}${fmt(Math.abs(r.val))}</span></div>`).join('');
  if(b.crisisLoan>0) rowsHTML += `<div class="breakdown-row" style="animation-delay:${rows.length*0.12}s;"><span>${t('prestamoEmergencia')}</span><span class="neg">+${fmt(b.crisisLoan)} ${t('deudaTxt')}</span></div>`;
  rowsHTML += `<div class="breakdown-row total" style="animation-delay:${(rows.length+1)*0.12}s;"><span>${t('efectivoAhora')}</span><span id="breakdownFinalCash">...</span></div>`;

  stageEl.innerHTML = `
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="particle-layer" id="particleLayer"></div>
    ${topbarHTML()}
    <div class="scene">
      <div class="month-title" style="font-size:18px;">${t('resumenDe')} ${mo.name}</div>
      <div class="mono-wrap">${faceHTML(fState)}</div>
      ${toasts}
      ${b.crisisLoan>0 ? `<div class="toast bad">${t('crisisToast')(fmt(b.crisisLoan))}</div>` : ''}
      <div class="breakdown">${rowsHTML}</div>
      <div style="flex:1"></div>
      <button class="btn-primary" onclick="afterBreakdown()">${t('continuar')}</button>
    </div>
  `;

  const cashEl = document.getElementById('cashReadout');
  const finalCashEl = document.getElementById('breakdownFinalCash');
  if(cashEl) animateNumber(cashEl, cashStart, state.cash, 700);
  if(finalCashEl) animateNumber(finalCashEl, cashStart, state.cash, 700);
  prevCashDisplay = state.cash;

  if(b.crisisLoan>0){
    sfxBad(); screenShake(); flash('bad');
    bumpStat('statDebtBox');
  } else {
    sfxCoin(); flash('good');
    bumpStat('statCashBox');
    const box = document.getElementById('statCashBox');
    if(box) spawnCoinBurst(box, 6, false);
  }
}

function afterBreakdown(){
  sfxClick();
  if(state.crisisCount >= 3){ return showEnd(true); }

  const surplus = state.cash - 150;
  if(surplus > 40){
    showSplitSlider(surplus);
  } else {
    advanceMonth();
  }
}

let splitRatio = 0.5;
function showSplitSlider(surplus){
  currentView = { name:'slider', surplus };
  splitRatio = 0.5;
  stageEl.innerHTML = `
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="particle-layer" id="particleLayer"></div>
    ${topbarHTML()}
    <div class="scene">
      <div class="month-title" style="font-size:18px;">${t('excedenteTitle')}</div>
      <div class="narrative">${t('excedenteP')(fmt(surplus))}</div>
      <div class="slider-box">
        <div class="slider-title">${t('arrastraTitle')}</div>
        <div class="slider-sub">${t('arrastraSub')}</div>
        <div class="split-readout">
          <span class="save" id="saveReadout">${t('ahorrar')}: $0</span>
          <span class="reinvest" id="reinvestReadout">${t('reinvertir')}: $0</span>
        </div>
        <div class="slider-track" id="sliderTrack">
          <div class="slider-fill" id="sliderFill" style="width:50%;"></div>
          <div class="slider-handle" id="sliderHandle" style="left:calc(50% - 19px);">💰</div>
        </div>
      </div>
      <div style="flex:1"></div>
      <button class="btn-primary" onclick="confirmSplit(${surplus})">${t('confirmarReparto')}</button>
    </div>
  `;
  setupSlider(surplus);
}

function setupSlider(surplus){
  const track = document.getElementById('sliderTrack');
  const fill = document.getElementById('sliderFill');
  const handle = document.getElementById('sliderHandle');
  const saveR = document.getElementById('saveReadout');
  const reinvR = document.getElementById('reinvestReadout');

  function update(ratio){
    splitRatio = clamp(ratio,0,1);
    fill.style.width = (splitRatio*100)+'%';
    handle.style.left = `calc(${splitRatio*100}% - 19px)`;
    saveR.textContent = t('ahorrar') + ': ' + fmt(surplus*splitRatio);
    reinvR.textContent = t('reinvertir') + ': ' + fmt(surplus*(1-splitRatio));
  }
  update(0.5);

  function posToRatio(clientX){
    const rect = track.getBoundingClientRect();
    return (clientX - rect.left) / rect.width;
  }
  let dragging = false;
  track.addEventListener('pointerdown', e=>{ dragging=true; update(posToRatio(e.clientX)); track.setPointerCapture(e.pointerId); });
  track.addEventListener('pointermove', e=>{ if(dragging) update(posToRatio(e.clientX)); });
  track.addEventListener('pointerup', ()=>{ dragging=false; });
  track.addEventListener('pointercancel', ()=>{ dragging=false; });
}

function confirmSplit(surplus){
  sfxCoin();
  const saveAmt = Math.round(surplus*splitRatio);
  const reinvAmt = surplus - saveAmt;
  state.savings += saveAmt;
  state.cash -= saveAmt;
  state.inventory = clamp(state.inventory + reinvAmt/4, 0, 150);
  state.cash -= reinvAmt;
  advanceMonth();
}

function advanceMonth(){
  if(state.nextBonusQueue){
    MONTHS_DATA.es[state.monthIndex+1].base += state.nextBonusQueue;
    MONTHS_DATA.en[state.monthIndex+1].base += state.nextBonusQueue;
    state.nextBonusQueue = 0;
  }
  state.monthIndex += 1;
  if(state.monthIndex >= MONTH_SLOTS().length){
    showEnd(false);
  } else {
    showMonthEvent();
  }
}

/* ============ END SCREEN ============ */
function showEnd(bankrupt){
  currentView = { name:'end', bankrupt };
  const outstanding = state.receivables.reduce((s,r)=>s+r.amount,0);
  const score = bankrupt ? Math.min(state.cash + state.savings, 300)
    : Math.round(state.cash + state.savings + outstanding*0.7 - state.debt*1.2);

  let tier, tierColor, tierIcon, faceState;
  if(bankrupt){ tier=t('tierNegocioCerrado'); tierColor="var(--danger)"; tierIcon="💀"; faceState='crisis'; }
  else if(score >= 2400){ tier=t('tierPlatino'); tierColor="#cfefff"; tierIcon="💎"; faceState='win'; }
  else if(score >= 1400){ tier=t('tierOro'); tierColor="var(--gold)"; tierIcon="🏆"; faceState='win'; }
  else if(score >= 700){ tier=t('tierPlata'); tierColor="#c9c9d6"; tierIcon="🥈"; faceState='cool'; }
  else { tier=t('tierBronce'); tierColor="#cd8b55"; tierIcon="🥉"; faceState='cool'; }

  if(bankrupt) sfxBad(); else sfxWin();

  stageEl.innerHTML = `
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="particle-layer" id="particleLayer"></div>
    ${langToggleHTML()}
    <div class="end-screen">
      <div class="mono-wrap" style="height:80px;">${faceHTML(faceState)}</div>
      <div class="hex-badge">
        ${hexSVG(tierColor)}
        <div class="label" style="font-size:40px;">${tierIcon}</div>
      </div>
      <div class="end-title" style="color:${tierColor};">${tier}</div>
      <div class="end-score" id="endScoreEl">$0</div>
      <div class="end-sub">${bankrupt ? t('negocioCerradoSub') : t('puntajeFinal')}</div>
      <div class="end-recap">
        <div class="breakdown-row" style="animation-delay:0.1s;"><span>${t('efectivoFinal')}</span><span>${fmt(state.cash)}</span></div>
        <div class="breakdown-row" style="animation-delay:0.2s;"><span>${t('ahorrosProtegidos')}</span><span>${fmt(state.savings)}</span></div>
        <div class="breakdown-row" style="animation-delay:0.3s;"><span>${t('porCobrar')}</span><span>${fmt(outstanding)}</span></div>
        <div class="breakdown-row" style="animation-delay:0.4s;"><span>${t('deudaPendiente')}</span><span class="neg">-${fmt(state.debt)}</span></div>
        <div class="breakdown-row" style="animation-delay:0.5s;"><span>${t('crisisDeEfectivo')}</span><span>${state.crisisCount}</span></div>
      </div>
      <button class="btn-primary" onclick="renderBusinessSelect()">${t('jugarDeNuevo')}</button>
    </div>
  `;
  const scoreEl = document.getElementById('endScoreEl');
  animateNumber(scoreEl, 0, score, 1100);

  if(!bankrupt && (score>=1400)){
    setTimeout(()=>spawnConfetti(50), 200);
  }
}

function hexSVG(color){
  return `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,2 96,27 96,83 50,108 4,83 4,27" fill="${color}" opacity="0.15" stroke="${color}" stroke-width="3"/>
  </svg>`;
}

/* ============ INIT ============ */
renderIntro();

</script>
</body>
